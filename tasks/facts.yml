---
# Read-only. Sets __lh_mount_plan [{path, fstab_line, remount, mount_new}] and __lh_mount_findings.
- name: facts | Select the managed mount points
  ansible.builtin.set_fact:
    __lh_mount_wanted: >-
      {{ __linux_hardening_mount_base | combine(linux_hardening_mount_extra) | dict2items
         | rejectattr('key', 'in', linux_hardening_mount_exclude) | items2dict }}

- name: facts | Stat the mount points
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
  loop: "{{ __lh_mount_wanted.keys() | list }}"
  register: __lh_mount_stats

- name: facts | List the running mounts
  ansible.builtin.command: findmnt --json --list --output TARGET,SOURCE,FSTYPE,OPTIONS
  register: __lh_mount_findmnt
  changed_when: false
  check_mode: false

- name: facts | Read the fstab
  ansible.builtin.slurp:
    src: "{{ linux_hardening_mount_fstab }}"
  register: __lh_mount_fstab_raw
  failed_when: false

- name: facts | Check the fstab as it is now
  ansible.builtin.command: "findmnt --verify --tab-file {{ linux_hardening_mount_fstab }}"
  register: __lh_mount_fstab_check
  changed_when: false
  failed_when: false
  check_mode: false
  when: __lh_mount_fstab_raw.content is defined

# The comparison and the fix plan live in filter_plugins/mount_hardening.py (unit-tested in tests/unit).
- name: facts | Compare with desired state
  ansible.builtin.set_fact:
    __lh_mount_plan: "{{ __lh_mount_result.plan }}"
    __lh_mount_findings: "{{ __lh_mount_result.findings }}"
  vars:
    __lh_mount_result: >-
      {{ __lh_mount_findmnt.stdout | mount_hardening_plan(
           __lh_mount_fstab_raw.content | default('') | b64decode,
           __lh_mount_wanted,
           __lh_mount_stats.results | selectattr('stat.exists') | map(attribute='item') | list,
           __linux_hardening_mount_opposite,
           __linux_hardening_mount_tmpfs_paths,
           linux_hardening_mount_create_tmpfs | bool) }}
