---
- name: Gather mount state
  ansible.builtin.include_tasks: facts.yml

# fstab first: if the edit is refused nothing has been remounted. The edit is checked with findmnt --verify,
# unless the fstab already fails that check before we touch it (then there is no baseline to compare with).
- name: Write the fstab entries
  ansible.builtin.lineinfile:
    path: "{{ linux_hardening_mount_fstab }}"
    regexp: "^\\s*\\S+\\s+{{ item.path | regex_escape }}\\s"
    line: "{{ item.fstab_line }}"
    backup: "{{ linux_hardening_backup | bool }}"
    mode: '0644'
    create: true
    validate: "{{ 'findmnt --verify --tab-file %s' if (__lh_mount_fstab_check.rc | default(1)) == 0 else omit }}"
  loop: "{{ __lh_mount_plan | selectattr('fstab_line') | list }}"
  loop_control:
    label: "{{ item.path }}"
  register: __lh_mount_fstab_edit

- name: Make systemd read the new fstab  # noqa: no-handler
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: __lh_mount_fstab_edit is changed

- name: Apply the options to the running mounts
  ansible.builtin.command: "mount -o remount,{{ item.remount }} {{ item.path }}"  # noqa: command-instead-of-module
  loop: "{{ __lh_mount_plan | selectattr('remount') | list }}"
  loop_control:
    label: "{{ item.path }}"
  changed_when: true

# raw, not command: Ansible unpacks its own module payload under /tmp, and a tmpfs mounted over /tmp hides it
# from the module that is still running (it then fails to return its result).
- name: Mount the new tmpfs
  ansible.builtin.raw: "mount {{ item.path }}"
  loop: "{{ __lh_mount_plan | selectattr('mount_new') | list }}"
  loop_control:
    label: "{{ item.path }}"
  changed_when: true
