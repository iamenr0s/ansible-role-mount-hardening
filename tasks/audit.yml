---
- name: Gather mount state
  ansible.builtin.include_tasks: facts.yml

- name: Record findings
  ansible.builtin.set_fact:
    linux_hardening_mount_findings: "{{ __lh_mount_findings }}"

- name: Report mount_hardening result
  ansible.builtin.debug:
    msg: "{{ 'COMPLIANT' if linux_hardening_mount_findings | length == 0 else linux_hardening_mount_findings }}"

# After remediation only fixable findings fail the run; a path without a partition needs a human.
- name: Fail on findings
  ansible.builtin.fail:
    msg: "mount_hardening found {{ __lh_mount_blocking | length }} deviation(s)."
  vars:
    __lh_mount_blocking: >-
      {{ linux_hardening_mount_findings
         if (linux_hardening_fail_on_error | bool) and not (__lh_mount_audit_fatal | default(false))
         else linux_hardening_mount_findings | selectattr('fixable') | list
         if (__lh_mount_audit_fatal | default(false)) else [] }}
  when: __lh_mount_blocking | length > 0
