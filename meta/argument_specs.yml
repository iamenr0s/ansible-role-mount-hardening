---
argument_specs:
  main:
    short_description: Audit and set nodev/nosuid/noexec on temporary and data mounts, in fstab and at runtime.
    options:
      linux_hardening_mode: {type: str, default: audit, choices: [audit, remediate], description: "audit is read-only."}
      linux_hardening_confirm_remediation: {type: bool, default: false, description: "Must be true before remediate changes anything."}
      linux_hardening_backup: {type: bool, default: true, description: "Back up the fstab before it changes."}
      linux_hardening_verify: {type: bool, default: true, description: "Re-audit after remediation."}
      linux_hardening_fail_on_error: {type: bool, default: true, description: "Fail the play when audit finds deviations."}
      linux_hardening_mount_enabled: {type: bool, default: true, description: "Run the role."}
      linux_hardening_mount_fstab: {type: path, default: /etc/fstab, description: "The fstab to manage."}
      linux_hardening_mount_extra: {type: dict, default: {}, description: "Extra or overriding mount points {path: [options]}."}
      linux_hardening_mount_exclude: {type: list, elements: path, default: [], description: "Mount points to leave alone."}
      linux_hardening_mount_create_tmpfs: {type: bool, default: false, description: "Allow mounting a tmpfs over /tmp (or /dev/shm) when it is not a mount."}
