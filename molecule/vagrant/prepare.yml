---
# A real separate filesystem with its own fstab entry (the "rewrite an existing line" path).
- name: Prepare a loop-mounted data filesystem
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Create and format the image
      ansible.builtin.shell: |
        set -e
        dd if=/dev/zero of=/root/data.img bs=1M count=64 status=none
        mkfs.ext4 -q -F /root/data.img
      args:
        creates: /root/data.img

    - name: Add it to the fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: /root/data.img /srv/data ext4 loop,defaults 0 2
        regexp: ' /srv/data '

    - name: Mount point
      ansible.builtin.file:
        path: /srv/data
        state: directory
        mode: '0755'

    - name: Mount
      ansible.builtin.command: mount /srv/data  # noqa: command-instead-of-module
      register: __m
      changed_when: __m.rc == 0
      failed_when: __m.rc != 0 and 'already mounted' not in __m.stderr
