---
- name: Converge (remediate)
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Remediate
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../.."  # noqa: role-name[path]
      vars:
        linux_hardening_mode: remediate
        linux_hardening_confirm_remediation: true
        linux_hardening_mount_create_tmpfs: true
        linux_hardening_mount_extra:
          /srv/data: [nodev, nosuid, noexec]
